syntax = "proto3";

package erp.inventory.v1;

option go_package = "github.com/erp/proto/inventory/v1";

service InventoryService {
  rpc GetStockLevel (GetStockLevelRequest) returns (StockLevelResponse);
  rpc GetStockLevels (GetStockLevelsRequest) returns (StockLevelsResponse);
  rpc CheckAvailability (CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
}

message GetStockLevelRequest {
  string tenant_id = 1;
  string sku = 2;
  string warehouse_id = 3; // optional, empty = all warehouses
}

message StockLevelResponse {
  string sku = 1;
  string product_name = 2;
  int64 quantity_on_hand = 3;
  int64 quantity_reserved = 4;
  int64 quantity_available = 5;
  int64 reorder_level = 6;
  string warehouse_id = 7;
}

message GetStockLevelsRequest {
  string tenant_id = 1;
  repeated string skus = 2;
  string warehouse_id = 3;
}

message StockLevelsResponse {
  repeated StockLevelResponse levels = 1;
}

message CheckAvailabilityRequest {
  string tenant_id = 1;
  repeated LineItem items = 2;
}

message LineItem {
  string sku = 1;
  int64 quantity_needed = 2;
  string warehouse_id = 3;
}

message CheckAvailabilityResponse {
  bool all_available = 1;
  repeated AvailabilityResult results = 2;
}

message AvailabilityResult {
  string sku = 1;
  int64 quantity_needed = 2;
  int64 quantity_available = 3;
  bool is_available = 4;
}
