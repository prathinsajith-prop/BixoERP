syntax = "proto3";

package erp.auth.v1;

option go_package = "github.com/erp/proto/auth/v1";

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUserPermissions (GetUserPermissionsRequest) returns (UserPermissionsResponse);
  rpc GetUserById (GetUserByIdRequest) returns (UserResponse);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string tenant_id = 3;
  string email = 4;
  repeated string roles = 5;
  repeated string permissions = 6;
}

message GetUserPermissionsRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message UserPermissionsResponse {
  string user_id = 1;
  repeated string roles = 2;
  repeated string permissions = 3;
}

message GetUserByIdRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message UserResponse {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool is_active = 6;
  repeated string role_ids = 7;
  string created_at = 8;
  string updated_at = 9;
}

message CheckPermissionRequest {
  string tenant_id = 1;
  string user_id = 2;
  string permission = 3; // resource:action format, e.g. "finance:journal_entry:read"
}

message CheckPermissionResponse {
  bool allowed = 1;
}
