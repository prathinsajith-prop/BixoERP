syntax = "proto3";

package erp.hr.v1;

option go_package = "github.com/erp/proto/hr/v1";

service HrService {
  rpc GetEmployee (GetEmployeeRequest) returns (EmployeeResponse);
  rpc GetEmployeesByDepartment (GetByDepartmentRequest) returns (EmployeesResponse);
}

message GetEmployeeRequest {
  string tenant_id = 1;
  string employee_id = 2;
}

message EmployeeResponse {
  string employee_id = 1;
  string employee_number = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string department_id = 6;
  string department_name = 7;
  string position_id = 8;
  string position_title = 9;
  string status = 10; // ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED
  string manager_id = 11;
}

message GetByDepartmentRequest {
  string tenant_id = 1;
  string department_id = 2;
}

message EmployeesResponse {
  repeated EmployeeResponse employees = 1;
}
