nameOverride: core

image:
  repository: erp/core

service:
  port: 3015
  grpcPort: 50065

database:
  host: postgresql.erp-infra.svc.cluster.local
  port: 5432
  name: auth_db

kafka:
  groupId: core

redis:
  host: redis.erp-infra.svc.cluster.local
  port: 6379

env:
  JWT_ISSUER: erp-core
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_DAYS: "30"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCK_DURATION_MINUTES: "30"
  PASSWORD_RESET_TTL_MINUTES: "60"
